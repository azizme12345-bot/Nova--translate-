<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16d39d" />
      <stop offset="100%" stop-color="#07513b" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corner representing the brand identity -->
  <rect width="512" height="512" rx="140" fill="url(#brand-grad)" />
  <!-- Central Stylized "A" letter -->
  <text x="256" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="240" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
  <!-- Interactive arrows matching the logo design -->
  <text x="400" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="90" font-weight="900" fill="#65f2c7" text-anchor="middle">↔</text>
</svg>
